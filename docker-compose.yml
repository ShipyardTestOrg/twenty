# Generated by curious
services:
  run-twenty:
    image: twentycrm/twenty-app-dev:latest
    ports:
      - 2020:3000
    environment:
      SERVER_URL: http://localhost:2020
      PG_DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      REDIS_URL: redis://redis:6379
      STORAGE_TYPE: local
      APP_SECRET: ${APP_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      shipyard.route: /
      shipyard.primary-route: "true"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d app
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    expose:
      - "5432"
  redis:
    image: redis:7-alpine
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -h 127.0.0.1 ping | grep PONG
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    expose:
      - "6379"
