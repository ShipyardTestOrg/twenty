# Generated by curious
services:
  twenty:
    build:
      context: .
      dockerfile: Dockerfile.curious
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      shipyard.route: /
      shipyard.primary-route: "true"
  postgres:
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -h 127.0.0.1 ping | grep PONG
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
